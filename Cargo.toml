[package]
name = "webshart"
version = "0.5.2"
edition = "2021"
authors = ["Merkle <62513+AsdithyaKrishna2131@users.noreply.github.com>"]
license = "MIT"
description = "Fast and memory-efficient webdataset shard reader with Python bindings"
repository = "https://github.com/youruMerklesername/webshart"
readme = "README.md"

[lib]
name = "webshart"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py312"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "signal"] }
